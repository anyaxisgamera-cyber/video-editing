name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Check skill discovery
        run: npx --yes skills add . --list
      - name: Validate skill frontmatter and links
        run: uv run --no-project --with pyyaml python .github/scripts/validate_skills.py
      - name: Compile Python scripts
        run: python3 -m compileall -q skills
      - name: Test video workbench
        run: python3 skills/video-editing/tests/smoke_test.py
      - name: Test production tooling
        run: uv run --no-project --with numpy python skills/video-editing/tests/production_test.py
      - name: Test asset discovery providers (recorded payloads, no network)
        run: python3 skills/video-editing/tests/providers_test.py
      - name: Test video analyzer
        run: python3 skills/analyze-video-editing/tests/smoke_test.py
      - name: Typecheck Remotion starter
        working-directory: skills/video-editing/assets/remotion-edit-template
        run: npm ci && npm run typecheck
      - name: Test creative workstation
        run: uv run --no-project --with numpy --with scipy --with soundfile python skills/creative-workstation/tests/smoke_test.py --require-audio
      - name: Test Telugu text layer
        run: python3 skills/telugu-cinematic-edit/tests/test_text.py
      - name: Typecheck creative workstation engine
        working-directory: skills/creative-workstation/engine
        run: npm ci && npm run typecheck
